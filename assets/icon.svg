<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hermes-by-Everything icon">
  <!--
    Hermes-by-Everything icon (favicon / app icon)
    纯飞翼 + 双蛇杖，方形画布，适配 favicon 和小尺寸
  -->

  <!-- 圆角背景 -->
  <rect width="128" height="128" rx="28" fill="#1E1B4B"/>

  <g transform="translate(64, 64) scale(2.1)">

    <!-- 双蛇杖主轴 -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 左翼 -->
    <path d="M 0 -14 Q -8 -18 -16 -14 Q -12 -12 -10 -10 Q -16 -8 -18 -4 Q -12 -5 -8 -4 Q -12 -1 -12 2 Q -7 0 -4 0 L 0 0 Z"
          fill="#C7D2FE"/>
    <!-- 右翼 -->
    <path d="M 0 -14 Q 8 -18 16 -14 Q 12 -12 10 -10 Q 16 -8 18 -4 Q 12 -5 8 -4 Q 12 -1 12 2 Q 7 0 4 0 L 0 0 Z"
          fill="#C7D2FE"/>

    <!-- 杖顶球 -->
    <circle cx="0" cy="-18" r="3" fill="#818CF8"/>

    <!-- 双蛇 -->
    <path d="M 0 -10 C -5 -6, 5 -2, 0 2 C -5 6, 5 10, 0 14"
          stroke="#E0E7FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 0 -10 C 5 -6, -5 -2, 0 2 C 5 6, -5 10, 0 14"
          stroke="#E0E7FF" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- 蛇头 -->
    <circle cx="-1.5" cy="-11" r="1.2" fill="#A5B4FC"/>
    <circle cx="1.5" cy="-11" r="1.2" fill="#A5B4FC"/>

    <!-- 速度线 -->
    <path d="M -10 20 L 10 20" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -7 24 L 7 24" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M -4 27 L 4 27" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
