<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hermes-by-Everything logo">
  <!--
    Hermes-by-Everything logo
    赫尔墨斯飞翼 + 双蛇杖 (Caduceus) 程式化设计
    飞翼象征「信使 / 速度 / 多平台传递」
    双蛇杖象征「编码 / 双向数据流 / 增强能力」
  -->

  <!-- ===== 左侧图标：飞翼 + 双蛇杖 ===== -->
  <g transform="translate(30, 30)">

    <!-- 双蛇杖的垂直主轴 -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 杖顶翅膀（左右对称的程式化飞翼） -->
    <!-- 左翼 -->
    <path d="M 0 -14 Q -8 -18 -16 -14 Q -12 -12 -10 -10 Q -16 -8 -18 -4 Q -12 -5 -8 -4 Q -12 -1 -12 2 Q -7 0 -4 0 L 0 0 Z"
          fill="#818CF8"/>
    <!-- 右翼（左翼镜像） -->
    <path d="M 0 -14 Q 8 -18 16 -14 Q 12 -12 10 -10 Q 16 -8 18 -4 Q 12 -5 8 -4 Q 12 -1 12 2 Q 7 0 4 0 L 0 0 Z"
          fill="#818CF8"/>

    <!-- 杖顶小球（赫尔墨斯杖的传统顶端） -->
    <circle cx="0" cy="-18" r="3" fill="#6366F1"/>

    <!-- 双蛇（缠绕主轴的两条蛇，象征双向数据流） -->
    <!-- 左蛇 -->
    <path d="M 0 -10 C -5 -6, 5 -2, 0 2 C -5 6, 5 10, 0 14"
          stroke="#A5B4FC" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 右蛇（镜像） -->
    <path d="M 0 -10 C 5 -6, -5 -2, 0 2 C 5 6, -5 10, 0 14"
          stroke="#A5B4FC" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- 蛇头小点 -->
    <circle cx="-1.5" cy="-11" r="1.2" fill="#6366F1"/>
    <circle cx="1.5" cy="-11" r="1.2" fill="#6366F1"/>

    <!-- 杖底（速度线，呼应飞翼靴） -->
    <path d="M -10 20 L 10 20" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -7 24 L 7 24" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M -4 27 L 4 27" stroke="#A5B4FC" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ===== 右侧文字：HBE ===== -->
  <g transform="translate(70, 0)">
    <!-- H -->
    <text x="0" y="40" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="30" font-weight="800" fill="#1F2937" letter-spacing="-0.5">HBE</text>
    <!-- 副标题 -->
    <text x="0" y="52" font-family="'SF Mono', 'Fira Code', Consolas, monospace"
          font-size="7.5" font-weight="500" fill="#6B7280" letter-spacing="1.2">HERMES · BY · EVERYTHING</text>
  </g>
</svg>
